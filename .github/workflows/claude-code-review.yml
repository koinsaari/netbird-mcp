name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  claude-review:
    if: >
      github.event_name == 'workflow_dispatch' || (
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.event.pull_request.title, 'chore(deps): bump '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read AGENTS.md, then review this PR for must-fix issues only:
            - Bugs or logic errors in Go code or workflows, including error paths that silently swallow failures
            - Security issues: the NetBird PAT leaked to logs, errors, or tool output; unescaped user input in NetBird API paths; MCP tools that write or delete beyond what was requested; overly broad GH Actions permissions; pull_request_target misuse
            - Violations of AGENTS.md rules
            - New MCP tools without tests

            Skip anything CI already enforces (go vet, go test, golangci-lint, goreleaser check), and skip style, subjective, or hypothetical feedback.

            Post inline comments for must-fix issues, then one top-level summary — explicitly say "looks good" if there are none. Don't manufacture issues to appear thorough.
          claude_args: |
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
