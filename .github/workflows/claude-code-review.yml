name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_dispatch:

jobs:
  claude-review:
    if: >
      github.event_name == 'workflow_dispatch' || (
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.actor != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'dependabot/') &&
      !startsWith(github.event.pull_request.title, 'chore(deps): bump '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Prompt adapted from the code-review command in anthropics/claude-plugins-official (Apache-2.0).
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Provide a code review for this pull request.

            Agent assumptions (apply to all agents and subagents):
            - All tools work. Do not test tools or make exploratory calls. Make this clear to every subagent you launch.
            - Only call a tool when the task needs it.

            Follow these steps precisely:

            1. Stop without commenting if the PR is closed, a draft, or a trivial change that is obviously correct (e.g. a dependency bump).

            2. Launch an agent to view the PR (`gh pr view`, `gh pr diff`) and return a summary of the changes.

            3. Launch 4 agents in parallel to review the changes independently. Each returns a list of issues, each with a description and the reason it was flagged (e.g. "CLAUDE.md adherence", "bug"). Tell every agent the PR title and description, so it knows the author's intent.

               Agents 1 + 2: CLAUDE.md compliance. Audit the changes against the root CLAUDE.md and any CLAUDE.md in directories of changed files.

               Agent 3: bug agent. Scan the diff for obvious bugs. Focus on the diff itself without extra context. Flag only significant bugs. Do not flag issues you cannot validate without context outside the diff.

               Agent 4: bug agent. Look for problems in the introduced code: security issues, incorrect logic, error paths that swallow failures. Read the changed files in full and the callers of changed functions when needed, but only flag issues within the changed code.

               We only want HIGH SIGNAL issues. Flag issues where:
               - the code will fail to compile or parse;
               - the code will definitely produce wrong results regardless of inputs (clear logic errors);
               - a clear, unambiguous CLAUDE.md rule is broken, and you can quote the exact rule.

               Do not flag style or quality concerns, potential issues that depend on specific inputs or state, or subjective suggestions. If you are not certain an issue is real, do not flag it. False positives erode trust and waste reviewer time.

            4. For each issue from step 3, launch a parallel subagent to validate it. Give it the PR title and description and the issue. Its job is to confirm with high confidence that the issue is real: for example, that a flagged undefined variable really is undefined, or that the CLAUDE.md rule applies to this file and is actually broken.

            5. Drop every issue not validated in step 4. The rest is the list of high-signal issues.

            6. If no issues remain, post this comment with `gh pr comment` and stop:

               ## Code review

               No issues found. Checked for bugs and CLAUDE.md compliance.

            7. Otherwise, list the comments you plan to leave (for yourself only, do not post the list), then post one inline comment per unique issue with `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`:
               - Describe the issue briefly.
               - For a small, self-contained fix, include a committable suggestion block, but only when committing it fixes the issue entirely.
               - For larger fixes (6+ lines, structural, or spanning several places), describe the issue and the fix without a suggestion block.
               - Cite and link the source of each issue (e.g. the CLAUDE.md rule). Code links use the full commit SHA and this format: https://github.com/OWNER/REPO/blob/FULL_SHA/path/file.go#L4-L7, with at least one line of context before and after.

            False positives, do not flag these in steps 3 and 4:
            - Pre-existing issues.
            - Something that looks like a bug but is actually correct.
            - Pedantic nitpicks a senior engineer would not flag.
            - Issues a linter catches (CI already runs go vet, go test, golangci-lint and goreleaser check; do not run them).
            - General code quality concerns, such as test coverage or general security, unless CLAUDE.md requires them.
            - Issues CLAUDE.md mentions but the code explicitly silences (e.g. a lint ignore comment).

            Use the gh CLI for GitHub, not web fetch. Create a todo list before starting.
          claude_args: |
            --max-turns 60
            --allowedTools "Agent,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Grep,Glob"
